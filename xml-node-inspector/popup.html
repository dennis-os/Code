<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:300px;font:13px/1.5 "Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
  color:#1c2530;background:#fbfcfd;overflow:hidden}
header{background:#12283d;color:#eaf1f7;padding:11px 14px;font-weight:650;font-size:13.5px;
  display:flex;align-items:center;gap:9px}
.badge{font-size:11px;padding:2px 7px;border-radius:9px;font-weight:600}
.badge-xml{background:#0b5fa5;color:#fff}
.badge-maybe{background:#e07b00;color:#fff}
.badge-neu{background:#2e7d32;color:#fff}
main{padding:14px 14px 16px}
p{color:#546474;margin-bottom:13px}
.row{display:flex;flex-direction:column;gap:8px}
button{font:inherit;font-weight:600;font-size:13px;padding:10px 14px;border:0;border-radius:7px;
  cursor:pointer;text-align:left;display:flex;align-items:center;gap:9px}
.primary{background:#12283d;color:#fff}
.primary:hover{background:#1d3d5c}
.secondary{background:#eef4f9;color:#26404f;border:1px solid #ccd7e2}
.secondary:hover{background:#dcedf8}
button:focus-visible{outline:2px solid #4aa3ff;outline-offset:2px}
.ico{font-size:17px;flex:0 0 20px;text-align:center}
.lbl{display:flex;flex-direction:column;gap:1px}
.sub{font-size:11px;font-weight:400;opacity:.7}
#info{font-size:11.5px;color:#7b8ea1;margin-top:13px;padding-top:11px;
  border-top:1px solid #e8edf2;word-break:break-all}
.spinner{display:none;margin-top:12px;font-size:12px;color:#546474;text-align:center}
</style></head><body>
<header>
  <span>XML Node Inspector</span>
  <span id="badge" class="badge" style="display:none"></span>
</header>
<main>
  <p id="desc">Erkenne die aktuelle Seite oder lade eine XML-Datei im Viewer.</p>
  <div class="row" id="actions"></div>
  <div id="info"></div>
  <div class="spinner" id="spin">⏳ Wird geladen…</div>
</main>
<script src="popup.js"></script>
</body></html>
